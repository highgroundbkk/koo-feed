<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal — KOO SUPERDEV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
nav{background:#0d0d1a;padding:0 24px;display:flex;align-items:center;gap:0;height:52px;position:sticky;top:0;z-index:99}
.nav-logo{font-weight:800;font-size:15px;color:#00d9ff;text-decoration:none;margin-right:20px}
nav a{font-size:13px;color:#888;text-decoration:none;padding:0 14px;height:52px;display:flex;align-items:center;border-bottom:3px solid transparent;transition:.2s}
nav a:hover{color:#fff}
nav a.active{color:#fff;border-bottom-color:#00d9ff}
.layout{display:grid;grid-template-columns:1fr 260px;gap:32px;max-width:1060px;margin:0 auto;padding:32px 24px}
.main h2{font-size:20px;font-weight:800;color:#0d0d1a;margin-bottom:4px}
.main .sub{font-size:13px;color:#888;margin-bottom:24px}
/* BLOG POST CARD */
.post{background:#fff;border:1px solid #e8e8e8;border-radius:12px;margin-bottom:20px;overflow:hidden;transition:.2s}
.post:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);border-color:#ccc}
.post-header{padding:20px 24px 14px;border-bottom:1px solid #f0f0f0}
.post-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-tag{padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.5px}
.tag-DECISION{background:#f3e8ff;color:#7c3aed}
.tag-SYSTEM{background:#e0f2fe;color:#0369a1}
.tag-NOTE{background:#dcfce7;color:#15803d}
.tag-IDEA{background:#fef3c7;color:#b45309}
.tag-DEFAULT{background:#f1f5f9;color:#64748b}
.post-date{font-size:12px;color:#aaa}
.post-title{font-size:18px;font-weight:700;color:#111;line-height:1.4}
.post-body{padding:20px 24px;font-size:14px;line-height:1.85;color:#333}
.post-body p{margin-bottom:12px}
.post-body strong{color:#111;font-weight:600}
.post-body ul{padding-left:20px;margin:8px 0}
.post-body li{margin-bottom:6px}
.post-body blockquote{border-left:3px solid #e0e0e0;padding-left:14px;color:#666;margin:12px 0;font-style:italic}
.post-body a{color:#0369a1;text-decoration:none}
.post-body a:hover{text-decoration:underline}
.post-body code{background:#f5f5f0;padding:2px 6px;border-radius:3px;font-size:12px;font-family:monospace;color:#c2410c}
/* SIDEBAR */
.sidebar-box{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:18px;margin-bottom:16px}
.sidebar-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#888;margin-bottom:12px}
.toc-item{font-size:13px;padding:6px 0;border-bottom:1px solid #f5f5f5;cursor:pointer;color:#444;transition:.2s}
.toc-item:hover{color:#0369a1}
.toc-item:last-child{border-bottom:none}
.toc-date{font-size:11px;color:#bbb;display:block}
.empty{text-align:center;color:#aaa;padding:60px 20px;font-size:14px}
footer{background:#0d0d1a;text-align:center;padding:20px;color:#555;font-size:12px;margin-top:40px}
footer a{color:#00d9ff;text-decoration:none}
@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">⚡ KOO SUPERDEV</a>
  <a href="signal.html">Signal</a>
  <a href="feed.html">Feed</a>
  <a href="journal.html" class="active">Journal</a>
</nav>
<div class="layout">
  <div class="main">
    <h2>📓 Development Journal</h2>
    <p class="sub">Architecture decisions, experiments, lessons — with references</p>
    <div id="entries"><div class="empty">Loading...</div></div>
  </div>
  <div class="sidebar">
    <div class="sidebar-box">
      <div class="sidebar-title">In this journal</div>
      <div id="toc"></div>
    </div>
    <div class="sidebar-box">
      <div class="sidebar-title">About</div>
      <div style="font-size:13px;color:#666;line-height:1.7">
        Written by KOO SUPERDEV team.<br>
        Decisions logged with context so we never repeat the same mistake.
      </div>
    </div>
  </div>
</div>
<footer>
  <a href="index.html">← Home</a> &nbsp;·&nbsp;
  <a href="https://github.com/highgroundbkk/koo-feed/blob/main/obra-superpowers.md">Raw Markdown</a>
</footer>
<script>
function tagClass(t){const m={DECISION:'DECISION',SYSTEM:'SYSTEM',NOTE:'NOTE',IDEA:'IDEA'};return'post-tag tag-'+(m[t]||'DEFAULT')}
function mdToHtml(text){
  return text
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^- (.+)/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>')
    .replace(/^> (.+)/gm,'<blockquote>$1</blockquote>')
    .split('\n\n').map(p=>p.trim()?`<p>${p.replace(/\n/g,' ')}</p>`:'').join('')
}
async function load(){
  const c=document.getElementById('entries');
  const toc=document.getElementById('toc');
  try{
    const r=await fetch('https://raw.githubusercontent.com/highgroundbkk/koo-feed/main/obra-superpowers.md?t='+Date.now());
    const txt=await r.text();
    const posts=[];let cur=null;
    txt.split('\n').forEach(line=>{
      const h=line.match(/^###?\s+([\d]{4}-[\d]{2}-[\d]{2}[^\n]*)/);
      const e=line.match(/^\[([\d\-\s:]+)\]\s+(\w+)\s+·\s+(.+)/);
      if(h){if(cur)posts.push(cur);cur={title:h[1],tag:'NOTE',lines:[]}}
      else if(e){if(cur)posts.push(cur);const[,date,tag,text]=e;cur={title:text,date:date.trim(),tag,lines:[]}}
      else if(cur&&!line.startsWith('#'))cur.lines.push(line);
    });
    if(cur)posts.push(cur);
    if(!posts.length){c.innerHTML='<div class="empty">No journal entries yet.</div>';return}
    const rev=posts.filter(p=>p.lines.join('').trim()).reverse();
    c.innerHTML=rev.map((p,i)=>`
      <div class="post" id="post-${i}">
        <div class="post-header">
          <div class="post-meta">
            <span class="${tagClass(p.tag)}">${p.tag}</span>
            ${p.date?`<span class="post-date">${p.date}</span>`:''}
          </div>
          <div class="post-title">${p.title}</div>
        </div>
        <div class="post-body">${mdToHtml(p.lines.join('\n'))}</div>
      </div>`).join('');
    toc.innerHTML=rev.map((p,i)=>`
      <div class="toc-item" onclick="document.getElementById('post-${i}').scrollIntoView({behavior:'smooth'})">
        ${p.title.substring(0,40)}${p.title.length>40?'…':''}
        ${p.date?`<span class="toc-date">${p.date}</span>`:''}
      </div>`).join('');
  }catch(err){c.innerHTML='<div class="empty">⚠️ Could not load. <a href="https://github.com/highgroundbkk/koo-feed/blob/main/obra-superpowers.md">Read on GitHub →</a></div>'}
}
load();
</script>
</body>
</html>
