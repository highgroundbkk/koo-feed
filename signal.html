<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal — KOO SUPERDEV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d0d1a;color:#e0e0e0;min-height:100vh}
nav{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid rgba(255,255,255,.08);background:#0d0d1a;position:sticky;top:0;z-index:99}
.nav-logo{font-weight:700;font-size:15px;color:#00d9ff;text-decoration:none}
nav a{font-size:13px;color:#888;text-decoration:none;padding:6px 10px;border-radius:6px;transition:.2s}
nav a:hover,nav a.active{background:rgba(0,217,255,.12);color:#00d9ff}
.page-header{padding:32px 24px 0;max-width:720px;margin:0 auto}
.page-header h2{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px}
.page-header p{font-size:13px;color:#888}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:20px 24px 0;max-width:720px;margin:0 auto}
.filter-btn{padding:5px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#888;font-size:12px;cursor:pointer;transition:.2s}
.filter-btn:hover,.filter-btn.active{border-color:#00d9ff;color:#00d9ff;background:rgba(0,217,255,.1)}
.container{max-width:720px;margin:0 auto;padding:20px 24px 60px}
.entry{border-left:3px solid rgba(255,255,255,.1);padding:14px 18px;margin-bottom:14px;border-radius:0 8px 8px 0;background:rgba(255,255,255,.03);transition:.3s}
.entry:hover{background:rgba(255,255,255,.06);border-left-color:#00d9ff}
.entry-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.entry-date{font-size:11px;color:#555}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.5px}
.tag-AI{background:rgba(139,92,246,.2);color:#a78bfa}
.tag-TOOL{background:rgba(16,185,129,.2);color:#6ee7b7}
.tag-RELEASE{background:rgba(245,158,11,.2);color:#fcd34d}
.tag-HN{background:rgba(249,115,22,.2);color:#fb923c}
.tag-BLOG{background:rgba(236,72,153,.2);color:#f9a8d4}
.tag-SIGNAL{background:rgba(0,217,255,.2);color:#00d9ff}
.tag-default{background:rgba(255,255,255,.1);color:#aaa}
.entry-title{font-size:14px;color:#e0e0e0;line-height:1.6}
.entry-link a{font-size:12px;color:#00d9ff;text-decoration:none;opacity:.7;display:inline-block;margin-top:4px;word-break:break-all}
.entry-link a:hover{opacity:1;text-decoration:underline}
.empty{text-align:center;color:#555;padding:60px 20px;font-size:13px}
footer{text-align:center;padding:24px;color:#555;font-size:12px;border-top:1px solid rgba(255,255,255,.06)}
footer a{color:#00d9ff;text-decoration:none}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">🚀 KOO SUPERDEV</a>
  <a href="signal.html" class="active">Signal</a>
  <a href="feed.html">Feed</a>
  <a href="journal.html">Journal</a>
</nav>
<div class="page-header">
  <h2>📡 Signal Dispatches</h2>
  <p>Curated AI/devtools ecosystem — filtered by bots every week</p>
</div>
<div class="filters">
  <button class="filter-btn active" onclick="filter('all',this)">All</button>
  <button class="filter-btn" onclick="filter('AI',this)">🤖 AI</button>
  <button class="filter-btn" onclick="filter('TOOL',this)">🔧 Tools</button>
  <button class="filter-btn" onclick="filter('RELEASE',this)">🚀 Releases</button>
  <button class="filter-btn" onclick="filter('HN',this)">🔶 HN</button>
  <button class="filter-btn" onclick="filter('BLOG',this)">✍️ Blog</button>
</div>
<div class="container" id="entries"><div class="empty">Loading...</div></div>
<footer>
  <a href="index.html">← Home</a> · <a href="https://raw.githubusercontent.com/highgroundbkk/koo-feed/main/signal.md">Raw</a>
</footer>
<script>
let allEntries=[];
function tagClass(t){const m={'AI':'AI','TOOL':'TOOL','TOOLS':'TOOL','RELEASE':'RELEASE','HN':'HN','BLOG':'BLOG','SIGNAL':'SIGNAL'};return'tag-'+(m[t]||'default')}
function render(entries){
  const c=document.getElementById('entries');
  if(!entries.length){c.innerHTML='<div class="empty">No entries yet.</div>';return}
  c.innerHTML=entries.map(e=>`
    <div class="entry" data-tag="${e.tag}">
      <div class="entry-meta">
        <span class="tag ${tagClass(e.tag)}">${e.tag}</span>
        <span class="entry-date">${e.date}</span>
      </div>
      <div class="entry-title">${e.text}</div>
      ${e.url?`<div class="entry-link"><a href="${e.url}" target="_blank" rel="noopener">${e.url}</a></div>`:''}
    </div>`).join('');
}
function filter(tag,btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render(tag==='all'?allEntries:allEntries.filter(e=>e.tag===tag));
}
async function load(){
  try{
    const r=await fetch('https://raw.githubusercontent.com/highgroundbkk/koo-feed/main/signal.md?t='+Date.now());
    const txt=await r.text();
    allEntries=[];
    txt.split('\n').forEach(line=>{
      line=line.trim();
      if(!line||line.startsWith('#'))return;
      // format: [date] TAG · text — verdict | url
      const m=line.match(/^\[([\d\-\s:]+)\]\s+(\w+)\s+·\s+(.+)/);
      if(m){
        const[,date,tag,rest]=m;
        const parts=rest.split(/\s*\|\s*/);
        const text=parts[0].trim();
        const url=parts[1]?.trim()||'';
        allEntries.unshift({date:date.trim(),tag,text,url});
      }
    });
    render(allEntries);
  }catch(e){document.getElementById('entries').innerHTML='<div class="empty">⚠️ Could not load. <a href="https://github.com/highgroundbkk/koo-feed/blob/main/signal.md" style="color:#00d9ff">Read on GitHub</a></div>'}
}
load();
</script>
</body>
</html>
